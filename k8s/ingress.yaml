apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: guestbook }
spec:
  gatewayClassName: nginx
  listeners:
    - host: guestbook.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: guestbook-api, port: { number: 80 } }